[project]
name = "dhan_bridge"
description = "Streams Dhan market data to a Vue frontend for screeners, alerts and paper trading. Never places real orders."
requires-python = ">=3.11,<3.12"
dynamic = ["version"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
files = ["dhan_bridge"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["dhanhq", "dhanhq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.coverage.run]
source = ["dhan_bridge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
