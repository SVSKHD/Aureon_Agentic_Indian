# nginx in front of dhan_bridge: TLS termination, WebSocket upgrade for /ws,
# proxy for /api and /health. /admin is never exposed publicly (use the
# host loopback port 127.0.0.1:8000 instead - see docs/RUNBOOK.md).
worker_processes auto;
events { worker_connections 1024; }

http {
    server_tokens off;
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream bridge {
        server bridge:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        client_max_body_size 1m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Market data stream (added in a later release).
        location /ws {
            proxy_pass http://bridge;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://bridge;
            proxy_set_header Connection "";
        }

        location = /health {
            proxy_pass http://bridge;
            proxy_set_header Connection "";
            access_log off;
        }

        location /admin/ {
            return 404;
        }

        # The Vue frontend will be served here in a later release.
        location / {
            return 404;
        }
    }
}
