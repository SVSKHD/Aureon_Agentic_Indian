# PostgreSQL 16 settings for the dhan_bridge compose stack (mounted read-only,
# started with -c config_file=/etc/postgresql/postgresql.conf). Sized for a
# personal app: 2-3 users, one bridge process with a pool of at most 5 connections,
# plus the occasional backup / psql session. Anything not set here uses the
# server default.

listen_addresses = '*'                      # reachable only on the internal compose network
port = 5432
unix_socket_directories = '/var/run/postgresql'   # ops tools: docker compose exec + local socket
max_connections = 30

shared_buffers = 256MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 64MB
wal_buffers = 8MB
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
dynamic_shared_memory_type = posix

password_encryption = scram-sha-256
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C'
lc_monetary = 'C'
lc_numeric = 'C'
lc_time = 'C'
default_text_search_config = 'pg_catalog.english'

log_destination = 'stderr'
log_min_duration_statement = 2000           # ms: slow statements only
log_connections = off
log_disconnections = off
log_line_prefix = '%m [%p] %q%u@%d '
