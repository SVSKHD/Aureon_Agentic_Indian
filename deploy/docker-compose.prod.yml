# Production stack. Lives on the host as /opt/dhan_bridge/docker-compose.yml (copied by Jenkins).
#
# Host layout (see README "Deployment"):
#   /opt/dhan_bridge/.env            compose variables: REGISTRY, BRIDGE_TAG (BRIDGE_TAG is rewritten by Jenkins)
#   /opt/dhan_bridge/bridge.env      non-secret app settings (BRIDGE_MODE, PAPER_CAPITAL, ...)
#   /opt/dhan_bridge/secrets/        dhan.env, db.env (DATABASE_URL), admin.key; group 10001, mode 0440
#   /opt/dhan_bridge/data/           backups/ (pg dumps), migrations-log/, bridge.lock; group 10001
#
# There is NO database service here: PostgreSQL is external (Supabase, session
# pooler or direct connection; any other Postgres host works the same way).
#   /opt/dhan_bridge/nginx.conf, certs/fullchain.pem, certs/privkey.pem
name: dhan_bridge

services:
  bridge:
    image: ${REGISTRY:?set REGISTRY in .env}/dhan_bridge:${BRIDGE_TAG:?set BRIDGE_TAG in .env}
    # A fixed container_name makes `docker compose up --scale bridge=2` impossible:
    # the Dhan feed must exist exactly once per deployment.
    container_name: dhan_bridge
    restart: unless-stopped
    env_file:
      - path: bridge.env
        required: false
    environment:
      BRIDGE_MODE: ${BRIDGE_MODE:-live}
      SECRETS_FILE: /run/secrets/dhan.env
      DB_SECRETS_FILE: /run/secrets/db.env
      # DB_SSLMODE (default "require") belongs in bridge.env, which ops.sh reads too:
      # an `environment:` entry here would silently override bridge.env.
      ADMIN_KEY_FILE: /run/secrets/admin.key
    volumes:
      - ./data:/app/data
      # The secrets DIRECTORY is mounted (read-only) so that an atomic `mv` of a new
      # dhan.env / db.env on the host is visible in the container. A single-file bind mount
      # pins the old inode and would silently keep serving the expired token.
      - ./secrets:/run/secrets:ro
    ports:
      # Loopback only: host-side health checks and admin calls. Public traffic goes via nginx.
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
