# Production stack. Lives on the host as /opt/dhan_bridge/docker-compose.yml (copied by Jenkins).
#
# Host layout (see README "Deployment" and "Database"):
#   /opt/dhan_bridge/.env            compose variables: REGISTRY, BRIDGE_TAG (rewritten by Jenkins),
#                                    optional PG_MEM_LIMIT, PG_CPUS, BRIDGE_MEM_LIMIT, BRIDGE_CPUS
#   /opt/dhan_bridge/bridge.env      non-secret app settings (BRIDGE_MODE, ALLOWED_ORIGINS, ...)
#   /opt/dhan_bridge/secrets/        dhan.env, db.env (DATABASE_URL), admin.key: group 10001, mode 0440
#                                    postgres_password: the same password as in db.env, mode 0400
#   /opt/dhan_bridge/postgresql.conf mounted read-only into the postgres service
#   /opt/dhan_bridge/data/           backups/ (pg dumps), migrations-log/, bridge.lock; group 10001
#   /opt/dhan_bridge/nginx.conf, certs/fullchain.pem, certs/privkey.pem
#
# PostgreSQL runs in this stack on an INTERNAL network: no published port, nothing
# but the bridge can reach it. Backups and host moves run pg tools in containers
# (scripts/ops.sh: `docker compose exec -T postgres ...`), never from the host.
# Moving the data to another Postgres host later is a db.env change (scripts/db-move.sh).
name: dhan_bridge

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: bridge
      POSTGRES_DB: bridge
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgresql.conf:/etc/postgresql/postgresql.conf:ro
    networks: [db]
    healthcheck:
      # TCP on purpose: during first-time initdb the server only listens on the socket
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U bridge -d bridge"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    shm_size: 128mb
    mem_limit: ${PG_MEM_LIMIT:-1g}
    cpus: ${PG_CPUS:-1.0}
    stop_grace_period: 60s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  bridge:
    image: ${REGISTRY:?set REGISTRY in .env}/dhan_bridge:${BRIDGE_TAG:?set BRIDGE_TAG in .env}
    # A fixed container_name makes `docker compose up --scale bridge=2` impossible:
    # the Dhan feed must exist exactly once per deployment.
    container_name: dhan_bridge
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: bridge.env
        required: false
    environment:
      BRIDGE_MODE: ${BRIDGE_MODE:-live}
      SECRETS_FILE: /run/secrets/dhan.env
      DB_SECRETS_FILE: /run/secrets/db.env
      # DB_SSLMODE (default "prefer") and ALLOWED_ORIGINS belong in bridge.env, which
      # ops.sh reads too: an `environment:` entry here would silently override bridge.env.
      ADMIN_KEY_FILE: /run/secrets/admin.key
    volumes:
      - ./data:/app/data
      # The secrets DIRECTORY is mounted (read-only) so that an atomic `mv` of a new
      # dhan.env / db.env on the host is visible in the container. A single-file bind mount
      # pins the old inode and would silently keep serving the expired token.
      - ./secrets:/run/secrets:ro
    networks: [default, db]
    ports:
      # Loopback only: host-side health checks and admin calls. Public traffic goes via nginx.
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: ${BRIDGE_MEM_LIMIT:-512m}
    cpus: ${BRIDGE_CPUS:-1.0}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    restart: unless-stopped
    depends_on:
      bridge:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

networks:
  default: {}
  db:
    internal: true   # no route out, no published port: only bridge <-> postgres

volumes:
  pgdata: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
